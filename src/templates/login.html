<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Sign in — NHL LED Scoreboard</title>
<style>
  :root { --bg:#080c18; --card:#0d1526; --input:#111c35; --primary:#4e6cb4; --primary-hi:#6b8cd4;
          --text:#dfe1df; --muted:#7a8aaa; --border:#1a2748; --error:#ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border);
          border-radius: 12px; padding: 28px 24px; }
  .mark { font-size: 34px; text-align: center; }
  h1 { font-size: 18px; text-align: center; margin: 6px 0 4px; }
  p.sub { color: var(--muted); text-align: center; margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input[type=password] { width: 100%; padding: 11px 12px; font-size: 16px; color: var(--text);
         background: var(--input); border: 1px solid var(--border); border-radius: 8px; }
  input[type=password]:focus { outline: none; border-color: var(--primary-hi); }
  button { width: 100%; margin-top: 16px; padding: 11px; font-size: 15px; font-weight: 600; color: #fff;
           background: var(--primary); border: 0; border-radius: 8px; cursor: pointer; }
  button:hover { background: var(--primary-hi); }
  .error { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4); color: #fca5a5;
           padding: 9px 12px; border-radius: 8px; margin-bottom: 14px; }
  .sr-only { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
</style>
</head>
<body>
<form class="card" method="post" action="{{ url_for('auth.login') }}">
  <div class="mark">🏒</div>
  <h1>NHL LED Scoreboard</h1>
  <p class="sub">Sign in to manage your scoreboard.</p>
  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
  <input class="sr-only" type="text" name="username" value="scoreboard" autocomplete="username" tabindex="-1" aria-hidden="true">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <label for="password">Password</label>
  <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
